# Sentry build-time config.
#
# Source-map auto-upload is intentionally disabled at build time via the
# SENTRY_DISABLE_AUTO_UPLOAD=true env var set in eas.json (all profiles).
# Runtime crash capture still works — Sentry is initialised in JS from
# src/lib/sentry.ts when EXPO_PUBLIC_SENTRY_DSN is provided.
#
# When you are ready to enable source-map upload, uncomment the lines
# below and inject `defaults.org`, `defaults.project`, and `auth.token`
# from EAS secrets — do NOT commit real values to git.
#
# defaults.org=<your-sentry-org-slug>
# defaults.project=<your-sentry-project-slug>
# defaults.url=https://sentry.io/
# auth.token=${SENTRY_AUTH_TOKEN}
