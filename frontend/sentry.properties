# Sentry build-time config.
# We do not want the iOS/Android build to fail if Sentry is not yet
# configured with an org/project (deployment secrets not injected).
# These flags skip the source-map upload phase safely so Xcode/Gradle
# can finish archiving the app.
defaults.org=none
defaults.project=none
defaults.url=https://sentry.io/
auth.token=
